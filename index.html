<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5B324">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bee's Limpieza">
<title>Bee's · Checklist de limpieza</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Figtree:wght@500;600;700;800&display=swap">
<style>
:root{
  --bg:#FFF6DE;--card:#FFFDF6;--ink:#17130C;--mu:#6B5E45;--line:#EADBB3;--soft:#FBEFCB;
  --honey:#F5B324;--honey-d:#B87C00;--ok:#1F9D55;--red:#DC2626;--bad:#C2410C;
  --fd:"Anton","Impact","Arial Narrow",sans-serif;--fb:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tab:64px;--lift:72px;color-scheme:light;
}
:root[data-theme=dark]{--bg:#14100A;--card:#201A10;--ink:#FFF3D6;--mu:#BFAF8E;--line:#3A3020;--soft:#2A2214;--honey-d:#F5B324;--ok:#5FD08F;--red:#F87171;--bad:#FB923C;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14100A;--card:#201A10;--ink:#FFF3D6;--mu:#BFAF8E;--line:#3A3020;--soft:#2A2214;--honey-d:#F5B324;--ok:#5FD08F;--red:#F87171;--bad:#FB923C;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--fb);overscroll-behavior-y:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
.app{max-width:600px;margin:0 auto;min-height:100dvh;padding:calc(env(safe-area-inset-top,0px)) 0 calc(var(--tab) + var(--lift) + env(safe-area-inset-bottom,0px) + 16px)}
.pad{padding:0 14px}
.mu{color:var(--mu)}.sm{font-size:13px}.xs{font-size:12px}
.h{font:400 26px/1 var(--fd);text-transform:uppercase;letter-spacing:.01em;margin:0}
.btn{border:0;border-radius:12px;background:var(--ink);color:var(--bg);font:800 15px/1 var(--fb);min-height:48px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none}
.btn.honey{background:var(--honey);color:#17130C}.btn.lt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}.btn.block{width:100%}.btn.sm{min-height:38px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45}
.btn svg,.ico svg{width:20px;height:20px;flex:none}
.ico{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;position:relative}
.ico .dot{position:absolute;top:6px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--card)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:3px 9px;font:800 11px/1.3 var(--fb)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.run{background:color-mix(in srgb,var(--honey) 28%,transparent);color:var(--honey-d)}
.pill.bad{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.pill.gr{background:var(--line);color:var(--mu)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
:focus-visible{outline:3px solid var(--honey);outline-offset:2px}

/* ---- Acceso ---- */
.login{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.brand{display:flex;align-items:center;gap:10px}
.hex{width:44px;height:48px;background:var(--honey);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;color:#17130C;font:400 24px/1 var(--fd)}
.brand b{font:400 30px/1 var(--fd);text-transform:uppercase}
.brand span{display:block;font:800 11px/1 var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin-top:4px}
.dots{display:flex;gap:16px;height:22px;margin-top:6px}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);transition:background .1s,transform .1s}
.dots i.on{background:var(--ink);transform:scale(1.08)}
.dots.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.perr{color:var(--red);font-weight:800;min-height:20px;margin:0;text-align:center}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:320px}
.keypad button{aspect-ratio:1.3;border-radius:18px;border:1px solid var(--line);background:var(--card);font:400 32px/1 var(--fd);cursor:pointer;touch-action:manipulation}
.keypad button:active{background:var(--honey);color:#17130C;transform:scale(.97)}
.keypad .k-txt{font:800 14px/1 var(--fb)}
.keypad .k-none{visibility:hidden}
.link{background:none;border:0;color:var(--honey-d);font:800 14px/1.2 var(--fb);text-decoration:underline;cursor:pointer;padding:8px}

/* ---- Encabezado ---- */
.top{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:10px 14px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.ring{--p:0;width:50px;height:50px;border-radius:50%;flex:none;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring span{width:40px;height:40px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:800 13px/1 var(--fb)}
.top .who{flex:1;min-width:0}
.top .who b{display:block;font:800 17px/1.15 var(--fb);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who span{font-size:12px;color:var(--mu)}
.banner{margin:4px 14px 10px;border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:13px}
.banner.off{background:color-mix(in srgb,var(--ok) 14%,var(--card));color:var(--ok)}
.banner.alert{background:color-mix(in srgb,var(--red) 12%,var(--card));color:var(--red)}
.banner.info{background:var(--soft);color:var(--ink)}

/* ---- Ahora ---- */
.sect{display:flex;align-items:baseline;justify-content:space-between;margin:14px 14px 8px}
.sect h2{font:800 13px/1 var(--fb);letter-spacing:.1em;text-transform:uppercase;margin:0;color:var(--mu)}
.now{display:flex;gap:10px;overflow-x:auto;padding:0 14px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.now::-webkit-scrollbar{display:none}
.nc{--st:var(--red);flex:none;width:72%;max-width:250px;scroll-snap-align:start;border-radius:16px;padding:12px 12px 10px;border:2px solid var(--st);background:var(--card);text-align:left;cursor:pointer;display:grid;gap:4px}
.nc.yellow{--st:var(--honey)}
.nc .k{font:800 11px/1.2 var(--fb);color:var(--st)} .nc.yellow .k{color:var(--honey-d)}
.nc b{font:800 16px/1.2 var(--fb)}
.nc .go{display:flex;align-items:center;gap:6px;font:800 13px/1 var(--fb);margin-top:6px}
.nc .go svg{width:18px;height:18px}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{background-color:var(--card)}50%{background-color:color-mix(in srgb,var(--st) 26%,var(--card))}}
.allgood{margin:0 14px;border-radius:16px;padding:14px;background:color-mix(in srgb,var(--ok) 12%,var(--card));color:var(--ok);font-weight:800;display:flex;gap:10px;align-items:center}
.allgood svg{width:22px;height:22px}

/* ---- Zonas y filas ---- */
.zone{margin:6px 14px 0}
.zh{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:10px 2px 6px;cursor:pointer;text-align:left}
.zh .zi{width:30px;height:33px;flex:none;background:var(--honey);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;color:#17130C}
.zh .zi svg{width:16px;height:16px}
.zh b{font:400 20px/1 var(--fd);text-transform:uppercase;flex:1}
.zh .chev{width:18px;height:18px;transition:transform .2s;color:var(--mu)}
.zone.closed .chev{transform:rotate(-90deg)}
.zone.closed .rows{display:none}
.rows{display:grid;gap:6px}
.row{--st:var(--ok);position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 14px;min-height:62px;cursor:pointer;text-align:left;width:100%}
.row .fill{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--st) 18%,transparent);z-index:0;transition:width .8s}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--st);z-index:1}
.row>*:not(.fill){position:relative;z-index:2}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font:800 15px/1.2 var(--fb);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx span{display:block;font-size:12px;color:var(--mu);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx .st{color:var(--st);font-weight:800}
.row.yellow{--st:var(--honey)} .row.yellow .tx .st{color:var(--honey-d)}
.row.red{--st:var(--red)} .row.off{--st:var(--ok)}
.row .cb{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--honey);color:#17130C;border:0}
.row .cb svg{width:22px;height:22px}
.row.green .cb,.row.off .cb{background:color-mix(in srgb,var(--ok) 14%,var(--card));color:var(--ok)}

/* ---- Entregas ---- */
.elist{display:grid;gap:10px;margin:0 14px}
.ecard{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;width:100%}
.ecard:disabled{opacity:.55}
.ecard .big{font:400 26px/1 var(--fd);text-transform:uppercase}
.ecard .tg{font:800 11px/1 var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--honey-d)}
.ecard .tx{flex:1;min-width:0;display:grid;gap:4px}
.ecard .arrow{width:22px;height:22px;color:var(--mu)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.task{margin:0 14px 8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.task.done{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.task h3{margin:0 0 8px;font:800 14px/1.25 var(--fb);display:flex;gap:8px}
.task h3 .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--honey);color:#17130C;display:grid;place-items:center;font-size:11px}
.task.done h3 .n{background:var(--ok);color:var(--onc)}
.task .note{font-size:12px;color:var(--mu);margin:-4px 0 8px 30px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.slot{position:relative;aspect-ratio:1;border-radius:10px;border:2px dashed var(--line);background:var(--bg);overflow:hidden;display:grid;place-items:center;cursor:pointer;padding:0}
.slot .add{display:grid;justify-items:center;gap:4px;font:800 11px/1.15 var(--fb);color:var(--mu);padding:4px;text-align:center}
.slot .add svg{width:24px;height:24px;color:var(--honey-d)}
.slot.has{border:2px solid var(--ok)}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font:700 10px/1.15 var(--fb);padding:3px 5px;text-align:left}
.slot .ck{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;background:var(--ok);color:var(--onc);display:grid;place-items:center;font-size:11px}
.slot.busy{border-style:solid;border-color:var(--honey)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--honey-d);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.stick{position:fixed;left:0;right:0;bottom:calc(var(--tab) + var(--lift) + 12px + env(safe-area-inset-bottom,0px));z-index:7;padding:10px 14px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.stick .in{max-width:572px;margin:0 auto;display:flex;align-items:center;gap:10px}
.backbar{display:flex;align-items:center;gap:10px;padding:10px 14px}
.backbar .h{flex:1}

/* ---- Mi día / registros ---- */
.mine{margin:0 14px;display:grid;gap:6px}
.mi{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.mi img{width:52px;height:52px;border-radius:8px;object-fit:cover;flex:none;background:var(--bg)}
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 14px 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.day{flex:none;min-width:54px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:7px 4px 6px;text-align:center;cursor:pointer;position:relative}
.day[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day .dn{font:800 10px/1 var(--fb);letter-spacing:.06em;text-transform:uppercase;display:block}
.day .dd{font:400 22px/1.1 var(--fd);display:block}
.day .dt{width:8px;height:8px;border-radius:50%;margin:2px auto 0;background:var(--line);display:block}
.day .dt.g{background:var(--ok)}.day .dt.y{background:var(--honey)}.day .dt.r{background:var(--red)}
.day input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.seg{display:flex;gap:4px;background:var(--line);padding:3px;border-radius:12px;margin:0 14px 10px}
.seg button{flex:1;border:0;background:transparent;font:800 13px/1 var(--fb);padding:11px 4px;border-radius:9px;cursor:pointer}
.seg button[aria-selected=true]{background:var(--card)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 14px 8px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 13px;font:800 12px/1 var(--fb);cursor:pointer}
.chip[aria-pressed=true]{background:var(--honey);border-color:var(--honey);color:#17130C}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0 14px 10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.kpi b{display:block;font:400 22px/1 var(--fd)} .kpi span{font:700 10px/1.2 var(--fb);color:var(--mu)}
.tl{position:relative;margin:0 14px;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:3px;border-radius:3px;background:var(--line)}
.th{font:400 18px/1 var(--fd);margin:12px 0 6px -22px;display:flex;align-items:center;gap:8px}
.th::before{content:"";width:17px;height:17px;border-radius:50%;background:var(--honey);border:3px solid var(--bg);flex:none}
.ev{--st:var(--ok);position:relative;margin:0 0 6px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--st);border-radius:0 12px 12px 0}
.ev.late{--st:var(--honey)}.ev.miss{--st:var(--red)}.ev.pend{--st:var(--line)}.ev.extra{--st:var(--mu)}
.ev::before{content:"";position:absolute;left:-20px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--st);border:2px solid var(--bg)}
.ev summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.ev summary::-webkit-details-marker{display:none}
.ev .et{font:800 14px/1.25 var(--fb)} .ev .es{font-size:12px;color:var(--mu)}
.ev .body{padding:0 12px 12px;display:grid;gap:8px}
.ev .body img{width:100%;max-height:320px;object-fit:cover;border-radius:10px;display:block;background:var(--bg)}
.ev.nd{padding:10px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:5px;margin-top:8px}
.thumbs button{padding:0;border:0;border-radius:8px;overflow:hidden;aspect-ratio:1;position:relative;background:var(--bg);cursor:zoom-in}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font:700 9px/1.1 var(--fb);padding:2px 3px;text-align:left}
.thumbs .miss{display:grid;place-items:center;aspect-ratio:1;border:1px dashed var(--red);border-radius:8px;color:var(--red);font:700 9px/1.1 var(--fb);text-align:center;padding:3px}
.emp{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.emp:first-child{border-top:0}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.checks label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:700;cursor:pointer;min-height:48px}
.checks label.wide{grid-column:1/-1}
.checks input{width:20px;height:20px;accent-color:var(--honey-d);flex:none}
input[type=text],input[type=tel],input[type=password],input[type=time]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:48px}
.lb{font:800 13px/1.2 var(--fb);display:block;margin:4px 0 6px}
.err{color:var(--red);font-weight:800;min-height:18px;margin:0;font-size:13px}

/* ---- Barra inferior ---- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:600px;margin:0 auto;display:flex;height:var(--tab)}
.tabs button{flex:1;border:0;background:none;display:grid;justify-items:center;align-content:center;gap:3px;font:800 11px/1 var(--fb);color:var(--mu);cursor:pointer;position:relative}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-selected=true]{color:var(--ink)}
.tabs button[aria-selected=true]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--honey)}
.tabs .badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:var(--onc);font:800 10px/18px var(--fb);padding:0 5px}

/* ---- Hojas, cámara, avisos ---- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
.sheet{background:var(--card);width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;max-height:92dvh;overflow:auto;animation:up .2s ease-out}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);justify-self:center;margin-bottom:4px}
.sheet h2{font:800 19px/1.2 var(--fb);margin:0}
.sheet .view{width:100%;max-height:55dvh;object-fit:contain;border-radius:12px;background:#000;display:block}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fd{from{opacity:0}}
.cam{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column;color:#fff}
.cam video,.cam img.prev{flex:1;width:100%;min-height:0;object-fit:cover;background:#000}
.cam .ct{position:absolute;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 30px;background:linear-gradient(rgba(0,0,0,.6),transparent);display:flex;align-items:center;gap:10px}
.cam .ct b{flex:1;font:800 15px/1.2 var(--fb);text-shadow:0 1px 3px #000}
.cam .cb2{display:flex;align-items:center;justify-content:space-around;padding:18px 20px calc(22px + env(safe-area-inset-bottom,0px));background:#000}
.cam .round{width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;cursor:pointer}
.cam .round svg{width:24px;height:24px}
.cam .shut{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:var(--honey);cursor:pointer}
.cam .shut:active{transform:scale(.94)}

/* ---- v2: saludo, línea de tiempo, retros, podio, ajustes ---- */
#main.slide-l{animation:sl .22s ease-out}#main.slide-r{animation:sr .22s ease-out}

.retro{display:flex;align-items:center;gap:10px;width:calc(100% - 28px);margin:0 14px 10px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card);text-align:left;cursor:pointer}

.tl-hit .tp:first-child::after,.tl-hit .tp:last-child::before{content:"";position:absolute;top:50%}
.tp.g{border-color:var(--ok);color:var(--ok)}.tp.y{border-color:var(--honey);color:var(--honey-d)}.tp.r{border-color:var(--red);color:var(--red)}.tp.f{color:var(--mu)}
.tl-det{position:relative;z-index:1;display:grid;gap:6px;margin:8px 0 2px;padding:10px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.tchip{display:flex;align-items:center;gap:8px;font:700 13px/1.25 var(--fb)}

.tchip.ok i{background:var(--ok);border-color:var(--ok)}.tchip.late i{background:var(--honey);border-color:var(--honey)}.tchip.miss i,.tchip.rep i{background:var(--red);border-color:var(--red)}.tchip.now i{border-color:var(--honey)}
.tl-now{position:relative;z-index:1;display:grid;gap:8px;margin:2px 0 14px}
.tl-lbl{text-align:center}.tl-lbl span{display:inline-block;background:var(--ink);color:var(--bg);font:800 11px/1 var(--fb);letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:99px}

.tcard .tt{flex:1;min-width:0;display:grid;gap:2px}.tcard .tt b{font-size:15px}

.tcard .go{display:grid;justify-items:center;gap:2px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;font:800 11px/1 var(--fb);flex:none;min-width:62px}

.tl-more{position:relative;z-index:1;display:flex;margin:0 auto 10px;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font:700 12px/1 var(--fb);color:var(--mu);cursor:pointer}

.tl-end{position:relative;z-index:1;text-align:center;font:700 11px/1 var(--fb);color:var(--mu)}.tl-end::before{content:"";display:block;width:12px;height:12px;border-radius:50%;background:var(--line);margin:0 auto 6px}
.ganador{display:flex;align-items:center;gap:12px;margin:6px 14px 6px;padding:14px;border-radius:18px;background:linear-gradient(135deg,#17130C,#3A2A0A);color:#FFF3D6}

@keyframes pop{from{opacity:0;transform:scale(.85)}}@keyframes spin{from{transform:rotate(-200deg) scale(.4)}}
.podio{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:0 14px 6px;padding-top:6px}
.pd{flex:1;max-width:120px;display:grid;justify-items:center;gap:3px;text-align:center}
.pd .pn{font:800 13px/1.15 var(--fb);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pd .pp{font-size:11px;color:var(--mu)}
.pd .pb{width:100%;border-radius:12px 12px 4px 4px;display:grid;place-items:center;color:#17130C;animation:grow .7s cubic-bezier(.2,1.2,.4,1) both}

/* ==== v3: vidrio, ramificaciones, panel y burbuja ==== */
:root{--onc:#fff;--gl:rgba(255,253,246,.42);--gl2:rgba(255,253,246,.62);--glb:rgba(255,255,255,.72);--glsh:0 6px 20px rgba(120,80,0,.08),inset 0 1px 0 rgba(255,255,255,.75);--blur:blur(14px) saturate(1.5);--b1:#F5B324;--b2:#F09595;--b3:#97C459;--b4:#85B7EB;--bo:.55}
:root[data-theme=dark]{--onc:#17130C;--gl:rgba(36,29,18,.5);--gl2:rgba(36,29,18,.74);--glb:rgba(255,243,214,.13);--glsh:0 6px 22px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,243,214,.08);--bo:.28}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--onc:#17130C;--gl:rgba(36,29,18,.5);--gl2:rgba(36,29,18,.74);--glb:rgba(255,243,214,.13);--glsh:0 6px 22px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,243,214,.08);--bo:.28}}
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;border-radius:50%;filter:blur(60px);opacity:var(--bo)}
.blobs i:nth-child(1){width:60vw;height:60vw;max-width:340px;max-height:340px;background:var(--b1);left:-18vw;top:-10vw}

.blobs i:nth-child(3){width:58vw;height:58vw;max-width:340px;max-height:340px;background:var(--b3);left:-10vw;bottom:-14vw}
.blobs i:nth-child(4){width:40vw;height:40vw;max-width:240px;max-height:240px;background:var(--b4);right:-8vw;bottom:22vh;opacity:calc(var(--bo) * .7)}
html{background:var(--bg)}body{background:transparent!important}
.gl,.card,.zone .zh,.row,.retro,.inicio,.mi,.ev,.kpi,.day,.chip,.ecard,.task,.tp,.tl-det,.tl-more,.tcard,.allgood,.emp-card,.estado,.acc,.rc,.eqr,.keypad button,.seg,.backbar .ico,.ico,.empty.it{background:var(--gl)!important;border:1px solid var(--glb);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--glsh)}
.row{border-left:0}
.tcard{border:1px solid var(--glb)!important;border-left:4px solid var(--st)!important}
.ev{border-left:4px solid var(--st)!important}
.day[aria-pressed=true],.chip[aria-pressed=true]{background:var(--ink)!important;color:var(--bg)}
.chip[aria-pressed=true]{background:var(--honey)!important;color:#17130C}
.seg button[aria-selected=true]{background:var(--gl2);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.top{background:var(--gl)!important;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.tabs{background:var(--gl2)!important;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-top:1px solid var(--glb)}
.stick{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.sheet{background:var(--gl2)!important;-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);border:1px solid var(--glb)}
.sheet-bg{background:rgba(0,0,0,.32)}
.sheet:not(.grow){opacity:0}
.sheet.grow{animation:bub .25s cubic-bezier(.2,.9,.3,1) both}
@keyframes bub{from{clip-path:circle(0 at var(--ox,50%) var(--oy,100%))}to{clip-path:circle(var(--or,150%) at var(--ox,50%) var(--oy,100%))}}
.sheet.shown{animation:none!important;clip-path:none!important;opacity:1}
.login .keypad button:active{background:var(--honey)!important}
.dots i{box-shadow:var(--glsh)}
#main.enter>*{animation:up .38s cubic-bezier(.2,1.3,.4,1) both}
#main.enter>*:nth-child(2){animation-delay:.05s}#main.enter>*:nth-child(3){animation-delay:.1s}#main.enter>*:nth-child(4){animation-delay:.15s}#main.enter>*:nth-child(5){animation-delay:.2s}#main.enter>*:nth-child(6){animation-delay:.25s}#main.enter>*:nth-child(7){animation-delay:.3s}#main.enter>*:nth-child(n+8){animation-delay:.35s}

.pop{animation:bub2 .25s cubic-bezier(.2,.9,.3,1) both}

/* panel */

.aic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.aic svg{width:22px;height:22px}
.aic.r{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}.aic.y{background:color-mix(in srgb,var(--honey) 24%,transparent);color:var(--honey-d)}.aic.g{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.att{flex:1;min-width:0;display:grid}.att b{font-size:15px}.att .sm{color:var(--mu);font-size:12px}
.acnt{font:400 24px/1 var(--fd);min-width:24px;text-align:right}.acnt.r{color:var(--red)}.acnt.y{color:var(--honey-d)}.acnt.g{color:var(--ok)}
.acc .chev{transition:transform .25s;color:var(--mu)}.acc .chev svg{width:18px;height:18px}.acc.open .chev{transform:rotate(90deg)}
.acc-b{padding:2px 10px 14px}
/* ramificación */
.rhead{display:grid;grid-template-columns:1fr 54px 1fr;text-align:center;font:800 11px/1 var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:2px 0 8px}
.rama{position:relative}
.rsp{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;border-radius:3px;background:linear-gradient(var(--glb),color-mix(in srgb,var(--honey-d) 40%,transparent))}
.pop .rsp{animation:spine .35s ease-out both}
@keyframes spine{from{transform:scaleY(0);transform-origin:top}}
.rrow{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 54px minmax(0,1fr);align-items:center;margin-bottom:12px}
.rrow:last-child{margin-bottom:0}
.rl,.rr{display:grid;gap:8px;min-width:0}.rl{justify-items:end}.rr{justify-items:start}
.rnd{justify-self:center;z-index:1;width:46px;height:46px;border-radius:50%;display:grid;place-content:center;text-align:center;font:400 15px/1 var(--fd);border:1px solid var(--glb);background:color-mix(in srgb,var(--line) 85%,transparent);color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.1),inset 0 1px 0 rgba(255,255,255,.55)}
.rnd small{font:800 8px/1 var(--fb);opacity:.85;margin-top:2px}
.rnd.big{width:56px;height:56px;font-size:17px}
.rnd.r{background:color-mix(in srgb,var(--red) 85%,transparent);color:var(--onc)}.rnd.y{background:color-mix(in srgb,var(--honey) 88%,transparent);color:#17130C}.rnd.g{background:color-mix(in srgb,var(--ok) 85%,transparent);color:var(--onc)}.rnd.n{color:var(--ink)}
.rnd.big.y,.rnd.big.r{box-shadow:0 0 0 4px color-mix(in srgb,var(--honey) 35%,transparent),0 4px 14px rgba(0,0,0,.1)}
.rc{position:relative;display:grid;gap:2px;max-width:100%;border-radius:14px;padding:8px 10px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;font-size:12px;min-width:0}
.rc b{font-size:13px;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.rc .sm{color:var(--mu);font-size:11px;line-height:1.25}
.rc .st{position:absolute;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--c)}
.rl .rc{padding-right:14px}.rl .rc .st{right:5px}.rr .rc{padding-left:14px}.rr .rc .st{left:5px}
.rl .rc::after,.rr .rc::before{content:"";position:absolute;top:50%;width:12px;border-top:2px solid var(--c);opacity:.75}
.rl .rc::after{right:-14px}.rr .rc::before{left:-14px}
.rc .pill{justify-self:start;margin-top:3px}
.acc-b .allgood{margin:0}
/* fotos por calificar */
.qc{width:100%;max-width:160px;cursor:default;padding:6px 6px 8px!important}
.qc b{white-space:nowrap}.qc img{width:100%;height:58px;object-fit:cover;border-radius:10px;display:block;cursor:zoom-in;background:var(--soft)}
.qc b{margin-top:4px;font-size:12px}
.qr{display:flex;justify-content:space-between;margin-top:6px}
.qd{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.9);padding:0;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.qd:active{transform:scale(.85)}
.qd.n4{background:var(--ok)}.qd.n3{background:var(--honey)}.qd.n2{background:#F97316}.qd.n1{background:var(--red)}
.qc .flash{position:absolute;inset:0;border-radius:14px;background:var(--fc);opacity:0;pointer-events:none}
.qc.ok .flash{animation:fl .3s}
@keyframes fl{40%{opacity:.5}}
.qc.gone{transition:transform .28s,opacity .28s;transform:scale(.5);opacity:0}
.qe{cursor:pointer}.rr .qc{padding-left:14px!important}.rl .qc{padding-right:14px!important}.qth{display:flex;gap:3px}.qth img{flex:1;min-width:0;height:44px;object-fit:cover;border-radius:7px}
.qe .pill svg{width:12px;height:12px}
.serie{margin-top:12px;background:var(--ink);color:var(--bg)}
/* equipo y semana */
.eqs{display:grid;gap:6px}
.eqr{display:flex;align-items:center;gap:10px;border-radius:14px;padding:10px 12px}
.eqr .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.eqr b{flex:none}.eqr .sm{flex:1;min-width:0;color:var(--mu);font-size:12px;text-align:right}
.eqr.q .dot{background:var(--red)}.eqr.q .sm{color:var(--red);font-weight:700}
.bars{display:flex;gap:6px;align-items:flex-end;height:130px;padding:4px 2px 0}
.bar1{flex:1;display:grid;grid-template-rows:1fr auto auto;justify-items:center;height:100%;gap:2px}
.bar1 i{align-self:end;width:100%;border-radius:8px 8px 4px 4px;background:var(--line);transform-origin:bottom;animation:grow .5s cubic-bezier(.2,1.2,.4,1) both}
.bar1 i.g{background:var(--ok)}.bar1 i.y{background:var(--honey)}.bar1 i.r{background:var(--red)}
.bar1 span{font:800 10px/1 var(--fb);color:var(--mu)}.bar1 em{font:700 10px/1 var(--fb);font-style:normal}
.mini-podio{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--glb);font-size:13px}
.mini-podio span{color:var(--mu)}.mini-podio .oro{color:var(--ink);font-weight:800}
/* retros por día y bitácora con línea */
.vr{position:relative;padding-left:26px;display:grid;gap:6px}
.vr::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:3px;border-radius:3px;background:linear-gradient(var(--honey),color-mix(in srgb,var(--honey) 20%,transparent))}
.vday{position:relative;margin:6px 0 0 -26px}
.vday span{display:inline-block;background:var(--honey);color:#17130C;font:800 11px/1 var(--fb);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:99px;box-shadow:0 0 0 3px var(--bg)}
.tl::before{background:linear-gradient(var(--honey),color-mix(in srgb,var(--honey) 15%,transparent))!important;width:3px!important}
.th{position:relative}
/* tareas de entrega como ramificación */
.task{position:relative;margin-left:44px!important}
.task::before{content:"";position:absolute;left:-31px;top:-10px;bottom:-10px;width:3px;background:color-mix(in srgb,var(--honey) 45%,transparent)}
.task .note{margin-left:0!important}.task h3{gap:0!important}.task h3 .n{position:absolute;left:-42px;top:10px;width:26px;height:26px;font-size:12px;box-shadow:0 0 0 3px var(--bg)}
.task h3 .n::after{content:"";position:absolute;left:26px;top:12px;width:16px;border-top:2px solid color-mix(in srgb,var(--honey) 60%,transparent)}
.task.done h3 .n::after{border-color:color-mix(in srgb,var(--ok) 60%,transparent)}
.tl-det.pop .tchip{animation:pp .3s both}
@media (prefers-reduced-motion:reduce){.earea,.earea .eorb,.eic,.tbtn.toca,.salir .it,.salir .wave,.pop,.pop *,.sheet.grow,#main.enter>*,.bar1 i,.rsp{animation:none!important}.sheet:not(.grow){opacity:1}}

/* ---- v4: ventana de salida, bitácora en ramas ---- */
.sheet-bg.center{align-items:center;padding:18px}
.sheet-bg.center .sheet{border-radius:26px;max-width:420px;padding:18px 16px 16px}
.sheet-bg.center .grab{display:none}
.salir{display:grid;gap:10px}
.salir .wave{font-size:38px;display:inline-block;transform-origin:70% 70%;animation:wv 1s .3s ease-in-out 2}
@keyframes wv{25%{transform:rotate(18deg)}75%{transform:rotate(-10deg)}}
.salir .it{animation:pp .34s cubic-bezier(.2,1.6,.4,1) both}
.sstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sst{background:var(--gl);border:1px solid var(--glb);box-shadow:var(--glsh);border-radius:16px;padding:10px 6px;text-align:center;display:grid;gap:2px}
.sst b{font:400 24px/1.1 var(--fd);color:var(--ink)}.sst b.g{color:var(--ok)}.sst b.y{color:var(--honey-d)}.sst b.r{color:var(--red)}
.sst .sm{color:var(--mu);font-size:11px}
.slbl{font:800 11px/1 var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin-top:2px}
.spend{display:flex;gap:10px;align-items:flex-start;background:var(--gl);border:1px solid var(--glb);border-left:4px solid var(--c);box-shadow:var(--glsh);border-radius:14px;padding:9px 10px}
.spend .si{color:var(--c);flex:none;font-size:16px;line-height:1}.spend .si svg{width:18px;height:18px}
.spend b{display:block;font-size:13px;color:var(--ink)}.spend .sm{color:var(--mu);font-size:12px}
.sok{display:flex;gap:8px;align-items:center;justify-content:center;padding:12px;border-radius:14px;background:color-mix(in srgb,var(--ok) 14%,var(--gl));color:var(--ok);font-weight:800}
.sok svg{width:20px;height:20px}
.sbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.evr{max-width:180px}
.evr img{width:100%;height:64px;object-fit:cover;border-radius:9px;margin-bottom:4px;display:block}
.evr .pill{margin-top:4px}.evr .cm{margin-top:3px;font-style:italic}
.rc.nd{cursor:default;opacity:.85}

/* ---- v5: íconos en hojas y entregas grandes ---- */
.sheet h2 svg,.sheet .btn svg,.card b svg,h2 svg{width:22px;height:22px;flex:none;vertical-align:-4px}
.sheet h2{display:flex;align-items:center;gap:8px}
.sheet svg:not([width]){max-width:28px;max-height:28px}
.sheet img.view{max-height:52vh;object-fit:contain}
.egrid{display:grid;gap:14px;margin:0 14px}
.earea{position:relative;overflow:hidden;border-radius:24px;padding:16px 14px 14px;animation:up .45s cubic-bezier(.2,1.3,.4,1) both}
.earea .eorb{position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;filter:blur(8px);opacity:.55;animation:float 6s ease-in-out infinite}
.earea.cocina .eorb{background:radial-gradient(circle at 40% 40%,color-mix(in srgb,var(--honey) 80%,transparent),transparent 70%)}
.earea.salon .eorb{background:radial-gradient(circle at 40% 40%,color-mix(in srgb,#F09595 80%,transparent),transparent 70%)}
@keyframes float{50%{transform:translate(-10px,12px) scale(1.06)}}
.ehd{position:relative;display:flex;align-items:center;gap:14px;margin-bottom:14px}
.eic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--ink);color:var(--honey);box-shadow:0 8px 20px rgba(0,0,0,.18);animation:bob 3.5s ease-in-out infinite}
.earea.salon .eic{color:#F7A6A6}
.eic svg{width:34px;height:34px}
@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
.ehd .tg{display:block;font:800 11px/1 var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.ehd b{display:block;font:400 38px/1 var(--fd);text-transform:uppercase;margin-top:4px}
.ebtns{position:relative;display:grid;gap:10px}
.tbtn{display:flex;align-items:center;gap:12px;width:100%;min-height:84px;padding:12px;border-radius:18px;border:1px solid var(--glb);background:var(--gl2);box-shadow:var(--glsh);text-align:left;cursor:pointer;color:var(--ink);transition:transform .12s}
.tbtn:active{transform:scale(.97)}
.tbtn:disabled{opacity:.55;cursor:default}
.tri{--c:var(--honey);width:56px;height:56px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p) * 1%),color-mix(in srgb,var(--line) 70%,transparent) 0)}
.tri>span{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--c)}
.tri svg{width:22px;height:22px}
.tbtn.done .tri{--c:var(--ok)}.tbtn.rep .tri{--c:var(--red)}.tbtn.off .tri{--c:var(--mu)}
.ttx{flex:1;min-width:0;display:grid;gap:4px}
.ttx .tg{font:800 11px/1 var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--honey-d)}
.ttx b{font-size:15px;line-height:1.25}
.tbtn.rep .ttx b{color:var(--red)}.tbtn.done .ttx b{color:var(--ok)}
.tcta{display:flex;align-items:center;gap:2px;flex:none;padding:10px 12px;border-radius:14px;background:var(--ink);color:var(--bg);font:800 13px/1 var(--fb)}
.tcta svg{width:16px;height:16px}
.tbtn.done .tcta,.tbtn.off .tcta{background:transparent;color:var(--mu);border:1px solid var(--glb)}
.tbtn.toca{border:2px solid var(--honey);animation:glow 2.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--honey) 25%,transparent),var(--glsh)}}
.sect .pill{margin-left:auto}
/* Barra flotante: se eleva para que el distintivo de Netlify no la tape */
.tabs{left:12px!important;right:12px!important;bottom:calc(var(--lift) + env(safe-area-inset-bottom,0px))!important;max-width:576px;margin:0 auto;border-radius:24px;border:1px solid var(--glb)!important;box-shadow:0 10px 30px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.5);padding-bottom:0!important;overflow:hidden}
.tabs button[aria-selected=true]::before{left:32%;right:32%}
.tabs button[aria-selected=true]{background:color-mix(in srgb,var(--honey) 16%,transparent)}
.etips{margin:14px 14px 0;border-radius:22px;padding:14px;display:grid;gap:10px;animation:up .45s cubic-bezier(.2,1.3,.4,1) both}
.etips>b{display:flex;align-items:center;gap:6px;font-size:15px}.etips>b svg{width:18px;height:18px;color:var(--honey-d)}
.tip{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mu)}.tip>span:first-child{font-size:20px;line-height:1}
.tip b{display:block;color:var(--ink);font-size:13px}
/* ---- v6: fotos de pedidos de delivery ---- */
.ptag{display:inline-block;border-radius:6px;padding:2px 6px;font:800 10px/1.3 var(--fb);color:#fff;margin-right:5px;vertical-align:1px;background:var(--mu);letter-spacing:.02em}
.ptag.uber{background:#1F7A4D}.ptag.didi{background:#C4570B}.ptag.rappi{background:#D0204F}.ptag.resv{background:#6B5BD6}
.pill.hr{background:color-mix(in srgb,#85B7EB 30%,transparent);color:#1E4E7E}
:root[data-theme=dark] .pill.hr{color:#A9CDF2}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .pill.hr{color:#A9CDF2}}
.row.green{--st:var(--ok)}
.row .tx .ptag{display:inline-block;color:#fff;font-size:10px;margin-top:0}
.row .tx em.st{font-style:normal;display:inline}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
